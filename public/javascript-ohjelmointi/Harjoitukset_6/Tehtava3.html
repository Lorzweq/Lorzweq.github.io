<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 3</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }

        #map {
            width: 100%;
            max-width: 900px;
            height: 600px;
            border: 1px solid #cccccc;
        }

        .coursePopup {
            width: 260px;
            font-size: 13px;
        }

        .coursePopup img {
            width: 100%;
            height: auto;
            margin-bottom: 6px;
        }

        .coursePopup h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
        }

        .coursePopup p {
            margin: 2px 0;
        }

        .coursePopup .text {
            font-style: italic;
            margin-top: 6px;
        }

        #status {
            font-style: italic;
            color: #666666;
        }
    </style>
</head>
<body>
    <h1>Tehtävä 3</h1>
    <h2>Golfkentät</h2>
    <p id="status"></p>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        const status = document.getElementById("status");

        const map = L.map("map").setView([64.0, 26.0], 5);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap"
        }).addTo(map);


        const clusterGroup = L.markerClusterGroup();
        map.addLayer(clusterGroup);

        async function getCourses() {
            const response = await fetch("golf.json");

            if (!response.ok) {
                throw new Error("HTTP-virhe: " + response.status);
            }

            return await response.json();
        }

        
        function createPopup(course) {
            const div = document.createElement("div");
            div.className = "coursePopup";
            
            
            const image = document.createElement("img");
            image.src = course.image;
            image.alt = course.course;

            image.addEventListener("error", () => {
                image.onerror = null;              
                image.src = "placeholder.jpg";
            });

            const title = document.createElement("h3");
            title.textContent = course.course;

            const type = document.createElement("p");
            type.textContent = "Taso: " + course.type;

            const address = document.createElement("p");
            address.textContent = course.address;

            const phone = document.createElement("p");
            phone.textContent = course.phone;

            const email = document.createElement("p");
            const emailLink = document.createElement("a");
            emailLink.href = "mailto:" + course.email;
            emailLink.textContent = course.email;
            email.appendChild(emailLink);

            const web = document.createElement("p");
            const webLink = document.createElement("a");
            webLink.href = course.web;
            webLink.target = "_blank";
            webLink.rel = "noopener";
            webLink.textContent = course.web;
            web.appendChild(webLink);

            const text = document.createElement("p");
            text.className = "text";
            text.textContent = course.text;

            div.append(image, title, type, address, phone, email, web, text);
            return div;
        }

        function renderCourses(courses) {
            courses.forEach(course => {
                const marker = L.marker([course.lat, course.lng]);
                marker.bindPopup(createPopup(course), { maxWidth: 300 });
                clusterGroup.addLayer(marker);
            });
        }


        async function init() {
            status.textContent = "Ladataan golfkenttiä...";

            try {
                const data = await getCourses();
                const courses = data.courses;

                renderCourses(courses);
                status.textContent = `${courses.length} golfkenttää kartalla.`;
            } catch (error) {
                status.textContent = "Kenttätietojen lataaminen epäonnistui.";
                console.error(error);
            }
        }

        

        init();
    </script>
</body>
</html>
