<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 1</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }

        #map {
            width: 800px;
            height: 600px;
            border: 1px solid #cccccc;
        }
    </style>
</head>
<body>
    <h1>Tehtävä 1</h1>
    <h2>Viisi suosikkikaupunkiani</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const cities = [
            { name: "Jyväskylä", lat: 62.2426, lon: 25.7473, text: "Kotikaupunki." },
            { name: "Kuopio", lat: 62.8924, lon: 27.6770, text: "Savon pääkaupunki." },
            { name: "Tampere", lat: 61.4978, lon: 23.7610, text: "Näsijärvi täällä" },
            { name: "Helsinki", lat: 60.1699, lon: 24.9384, text: "Pääkaupunki." },
            { name: "Vantaa", lat: 60.2928, lon: 25.0436, text: "Helsingin läheinen kaupunki." }
        ];

        const map = L.map('map').setView([64.0, 26.0], 5);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap"
        }).addTo(map);

        cities.forEach(city => {
            L.marker([city.lat, city.lon])
                .addTo(map)
                .bindPopup(`<b>${city.name}</b><br>${city.text}`);
        })
    </script>
</body>
</html>
