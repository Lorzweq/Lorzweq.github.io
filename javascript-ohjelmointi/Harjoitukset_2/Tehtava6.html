<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 6</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            border-style: dashed;
            border-width: 2px;
            width: 30em;
            padding: 10px;
        }
        #results {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>Tehtävä 6</h1>
    <div class="container">
        <h2>Date and time</h2>
        <div id="results"></div>
    </div>

    <script>
        function dateTime() {
            const output = document.getElementById("results");

            const showTime = () => {
                const now = new Date().toLocaleString("fi-FI", {
                    weekday: "long",
                    day: "numeric",
                    month: "numeric",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                });
                output.innerHTML = `Päivämäärä ja aika: <strong>${now}</strong>`;
            };

            showTime();                    
            setInterval(showTime, 1000);   
        }

        window.onload = dateTime;
    </script>
</body>
</html>
