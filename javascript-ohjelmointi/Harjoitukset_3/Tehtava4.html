<!DOCTYPE html>

</head>
<body>
    <h1>Tehtävä 4</h1>
    <script>
        const fruits = {
            Apple: 3,
            Banana: 5,
            Orange: 2,
            Grape: 1
        };

        let sum = 0;
        for (const key in fruits) {
            sum += fruits[key];
        }
        console.log("Fruit count is: " + sum);
    </script>
    
</body>
