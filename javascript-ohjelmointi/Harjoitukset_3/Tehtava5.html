<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 5</title>
</head>
<body>
    <h1>Tehtävä 5</h1>
    <script>
        const circle = {
            radius: 5,
            color: "red",
            getArea() {
                return (Math.PI * this.radius ** 2).toFixed(2);
            },
            getCircumference() {
                return (2 * Math.PI * this.radius).toFixed(2);
            }
        };
        console.log("Circle radius is " + circle.radius + " and its color is " + circle.color);
        for (let key in circle) {
            if (typeof circle[key] === "function") {
                if (key === "getArea") {
                    console.log("Area is: " + circle[key]());
                } else if (key === "getCircumference") {
                    console.log("Circumference is: " + circle[key]());
                }
            } 
        }
    </script>
</body>
</html>
