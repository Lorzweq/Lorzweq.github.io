<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 2</title>
</head>
<body>
    <h1>Tehtävä 2</h1>
    <button id="jokeButton">Get a random joke</button>

    <p id="joke"></p>

    <script>
        const jokeButton = document.getElementById("jokeButton");
        const jokeParagraph = document.getElementById("joke");

        async function fetchJoke() {
            jokeParagraph.textContent = "Ladataan...";
            jokeButton.disabled = true;

            try {
                const response = await fetch("https://api.chucknorris.io/jokes/random");

                if (!response.ok) {
                    throw new Error("HTTP-virhe: " + response.status);
                }

                const data = await response.json();
                jokeParagraph.textContent = data.value;
            } catch (error) {
                jokeParagraph.textContent = "Vitsin hakeminen epäonnistui.";
                console.error(error);
            } finally {
                jokeButton.disabled = false;
            }
        }

        jokeButton.addEventListener("click", fetchJoke);
    </script>
</body>
</html>
