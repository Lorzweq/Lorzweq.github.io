<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 4</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }

        #controls {
            margin-bottom: 20px;
        }

        select {
            font-size: 14px;
            padding: 5px;
        }

        #products {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .productCard {
            border: 1px solid #cccccc;
            border-radius: 5px;
            width: 220px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .productImage {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .productTitle {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        .productCategory {
            font-size: 11px;
            color: #666666;
            margin: 0 0 5px 0;
        }

        .productPrice {
            font-size: 16px;
            font-weight: bold;
            margin: auto 0 5px 0;
        }

        .productRating {
            font-size: 12px;
            color: #666666;
            margin: 0;
        }

        #status {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Fake Store -products</h1>

    <div id="controls">
        <label for="categorySelect">Category:</label>
        <select id="categorySelect">
            <option value="all">All products</option>
        </select>
    </div>

    <p id="status"></p>
    <div id="products"></div>

    <script>
        const categorySelect = document.getElementById("categorySelect");
        const productsDiv = document.getElementById("products");
        const status = document.getElementById("status");

        async function getProducts(category) {
            let url = "https://fakestoreapi.com/products";

            if (category && category !== "all") {
                url = `https://fakestoreapi.com/products/category/${encodeURIComponent(category)}`;
            }

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("HTTP-virhe: " + response.status);
            }

            return await response.json();
        }

        async function getCategories() {
            const response = await fetch("https://fakestoreapi.com/products/categories");

            if (!response.ok) {
                throw new Error("HTTP-virhe: " + response.status);
            }

            return await response.json();
        }

        function createProductCard(product) {
            const card = document.createElement("div");
            card.className = "productCard";

            const image = document.createElement("img");
            image.className = "productImage";
            image.src = product.image;
            image.alt = product.title;

            const title = document.createElement("p");
            title.className = "productTitle";
            title.textContent = product.title;

            const category = document.createElement("p");
            category.className = "productCategory";
            category.textContent = product.category;

            const price = document.createElement("p");
            price.className = "productPrice";
            price.textContent = new Intl.NumberFormat("fi-FI", {
                style: "currency",
                currency: "EUR"
            }).format(product.price);

            const rating = document.createElement("p");
            rating.className = "productRating";
            rating.textContent = `Rating ${product.rating.rate} (${product.rating.count} ratings)`;

            card.append(image, title, category, price, rating);
            return card;
        }


        async function renderProducts(category) {
            status.textContent = "Loading products...";
            productsDiv.replaceChildren();

            try {
                const products = await getProducts(category);
                console.log(products);

                products.forEach(product => {
                    productsDiv.appendChild(createProductCard(product));
                });

                status.textContent = `${products.length} products`;
            } catch (error) {
                status.textContent = "Loading products failed.";
                console.error(error);
            }
        }

        async function renderCategories() {
            try {
                const categories = await getCategories();

                categories.forEach(category => {
                    const option = document.createElement("option");
                    option.value = category;
                    option.textContent = category;
                    categorySelect.appendChild(option);
                });
            } catch (error) {
                console.error(error);
            }
        }

        categorySelect.addEventListener("change", () => {
            renderProducts(categorySelect.value);
        });
        renderCategories();
        renderProducts("all");
    </script>
</body>
</html>
