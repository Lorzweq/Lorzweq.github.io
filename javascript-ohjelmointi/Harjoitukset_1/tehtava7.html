<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 7</title>
</head>
<body>
    <h1>Tehtävä 7</h1>
    <script>
        function onkoKarkausvuosi(vuosi) {
            if ((vuosi % 4 === 0 && vuosi % 100 !== 0) || vuosi % 400 === 0) {
                return true;
            } else {
                return false;
            }
        }

        function pääOhjelma(vuosi) {
            var tulos = onkoKarkausvuosi(vuosi);
            if (tulos) {
                console.log(vuosi + " -> on karkausvuosi");
            } else {
                console.log(vuosi + " -> ei ole karkausvuosi");
            }
        }

        pääOhjelma(1991);
        pääOhjelma(1992);
        pääOhjelma(1900);
        pääOhjelma(2000);
    </script>
</body>
</html>
