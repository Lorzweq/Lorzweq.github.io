<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 10</title>
</head>
<body>
    <h1>Tehtävä 10</h1>
    <script>
        function laskePisteet() {
            var pisteet = [];
            var biggest = 0;
            var smallest = 0;
            var summa = 0;
            for (var i = 0; i < 5; i++) {
                var piste = parseInt(prompt("Anna piste " + (i + 1) + ":"));
                pisteet.push(piste);
                if (i === 0) {
                    biggest = piste;
                    smallest = piste;
                } else {
                    if (piste > biggest) {
                        biggest = piste;
                    }
                    if (piste < smallest) {
                        smallest = piste;
                    }
                }
            }
            for (var i = 0; i < 5; i++) {
                summa += pisteet[i];
            }
            summa = summa - biggest - smallest;
            console.log("Pisteiden summa: " + summa);
            console.log("Suurin piste: " + biggest);
            console.log("Pienin piste: " + smallest);
        }
        laskePisteet();
    </script>
</body>
</html>
