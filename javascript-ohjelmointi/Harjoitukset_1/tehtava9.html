<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 9</title>
</head>
<body>
    <h1>Tehtävä 9</h1>
    <script>
        function annaNimiä() {
            var nimet = [];
            while (true) {
                var name = prompt("Give a new name: ");
                if (name === "") {
                    break;
                }
                nimet.push(name);
                console.log("Name: " + name);
            }
            console.log("Names in the order given: " + nimet + "\n");
            var aakkosissa = nimet.slice().sort();
            console.log("Sorted names: " + aakkosissa + "\n");
        }
        annaNimiä();
    </script>
</body>
</html>
