<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 2</title>
</head>
<body>
    <h1>Tehtävä 2</h1>
    <script>
        var name1 = "Matti Mainio"
        var name2 = "Kirsi Kernell"
        var age1 = 30
        var age2 = 50
        if (age1 > age2) {
            console.log(name1 + " is " + (age1 - age2) + " years older than " + name2 + ".")
        } else if (age1 < age2) {
            console.log(name2 + " is " + (age2 - age1) + " years older than " + name1 + ".")
        } else {
            console.log(name1 + " and " + name2 + " are the same age.")
        }
    </script>
</body>
</html>
